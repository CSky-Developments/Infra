name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'proxy/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the infrastructure repository on the VPS
            cd /srv/infra
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Restart the proxy if there are changes
            cd proxy
            docker compose pull
            docker compose up -d
